  <section class="section">
    <div class="wrap">
      <h1 class="h-xl single sec-h">Contact Us</h1>
      <div class="narrow center ct-body">
        <h2 class="h-sub ink">We love to hear from you!</h2>
        <form class="contact-form ct-form" action="/api/contact" method="post">
          <div class="fld"><input id="c-name" name="name" type="text" autocomplete="name" placeholder=" "><label for="c-name">Name</label></div>
          <div class="fld"><input id="c-email" name="email" type="email" autocomplete="email" required placeholder=" "><label for="c-email">Email*</label></div>

          <div class="fld"><textarea id="c-interest" name="interest" rows="4" placeholder=" "></textarea><label for="c-interest">I'm interested in</label></div>
          <div class="fld"><textarea id="c-notes" name="message" rows="4" placeholder=" "></textarea><label for="c-notes">Other notes</label></div>
          <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
          <button class="btn ct-send" type="submit">Send</button>
          <p class="form-status ct-note" role="status" aria-live="polite">Prefer the phone? Call us at <a href="tel:+18609012262">860-901-2262</a>.</p>
        </form>
        <h2 class="h-sub ink ct-visit">Better yet, see us in person!</h2>
        <div class="rt ct-p"><p>We love our customers, so feel free to visit during normal business hours.</p></div>
