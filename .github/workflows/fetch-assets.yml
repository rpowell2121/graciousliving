name: Fetch site images from GoDaddy

# One-time migration of Gracious Living's own images and PDFs.
# Runs when the asset list changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/assets.json, scripts/fetch_assets.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_assets.py
      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/img public/docs scripts/image-sizes.json
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Add images and PDFs downloaded from the GoDaddy site"
          git pull --rebase origin main
          git push
